name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 129.80.240.109
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/umair-devops-site
            git fetch origin main
            git reset --hard origin/main
            sudo docker build -t umair-devops-portfolio:latest .
            sudo systemctl restart umair-devops-portfolio
            curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/
